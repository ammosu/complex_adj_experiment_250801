version: '3.8'

services:
  housing-analysis:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # 掛載數據目錄（本地數據不會包含在映像中）
      - ./data:/app/data
      - ./dashboard/data:/app/dashboard/data
      # 掛載配置（如需要）
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可選：添加 Nginx 反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - housing-analysis
    restart: unless-stopped
    profiles:
      - production